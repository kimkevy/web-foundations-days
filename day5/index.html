<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Day 5 Assignment - User Directory with Fetch API and Filtering">
  <title>Day 5 - User Directory</title>
  <link rel="stylesheet" href="style.css">
  <script src="users.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>User Directory</h1>
      <p class="subtitle">Fetch and filter remote user records via REST API</p>
    </header>

    <div class="controls">
      <div class="button-wrapper">
        <button id="load-users" type="button">Load Users</button>
      </div>

      <div class="filter-group">
        <label for="filter-input">Filter by name</label>
        <input type="text" id="filter-input" placeholder="Type a name to filter..." autocomplete="off">
      </div>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <ul id="users-list"></ul>
  </div>
</body>
</html>
