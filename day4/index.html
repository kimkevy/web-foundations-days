<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 - Notes Toolkit</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Notes Toolkit</h1>
      <button id="theme-toggle" type="button">Dark mode</button>
    </header>

    <main class="note-card">
      <div class="form-group">
        <label for="note-text" class="note-label">Your Note</label>
        <textarea id="note-text" placeholder="Type your note here... (Press Escape to clear)" rows="6"></textarea>
      </div>

      <div class="stats-bar">
        <div class="counters">
          <p id="char-count">0 / 200 characters</p>
          <p id="word-count">0 words</p>
        </div>
        <button id="clear-btn" type="button">Clear</button>
      </div>
    </main>
  </div>
</body>
</html>
